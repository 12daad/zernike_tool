[project]
name = "zernike-tool"
version = "0.4.0"
description = "Rectangular Zernike analysis and batch image correction"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "mypy>=1.18",
    "ruff>=0.14",
]

[project.gui-scripts]
zernike-corrector = "app.gui:launch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["zernike_tool", "app"]
# Native Tk widgets and event-loop callbacks require a graphical Windows
# session. Their domain logic is isolated in app/correction.py and unit tested.
omit = ["app/gui.py", "app/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["zernike_tool", "app"]

[tool.hatch.build.targets.wheel]
packages = ["zernike_tool", "app"]

[tool.hatch.build]
artifacts = ["zernike_tool/data/*.npy"]
