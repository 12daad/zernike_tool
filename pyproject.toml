[project]
name = "zernike-tool"
version = "0.8.0"
description = "Rectangular Zernike analysis and batch image correction"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.3",
    "pillow>=11.3",
    "tkinterdnd2>=0.6.3",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "mypy>=1.18",
    "ruff>=0.14",
]

[project.gui-scripts]
zernike-corrector = "zernike_tool.app.gui:launch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["zernike_tool"]
# Native Tk widgets and event-loop callbacks require a graphical Windows
# session. Their domain logic is isolated in zernike_tool/app/correction.py.
omit = ["zernike_tool/app/gui.py", "zernike_tool/app/__main__.py"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["zernike_tool"]

[tool.hatch.build.targets.wheel]
packages = ["zernike_tool"]

[tool.hatch.build]
artifacts = ["zernike_tool/data/*.npy"]
exclude = ["~$*", "*.xlsx"]
